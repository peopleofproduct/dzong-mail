<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dzong Mail - offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0a0a0a;
        color: #e4e4e7;
      }
      .card { text-align: center; max-width: 320px; padding: 24px; }
      h1 { font-size: 18px; font-weight: 600; margin: 16px 0 8px; }
      p { font-size: 13px; color: #a1a1aa; line-height: 1.5; margin: 0 0 16px; }
      button {
        background: #4f46e5;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 8px 20px;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon-192.png" width="72" height="72" alt="Dzong Mail" />
      <h1>Dzong Mail is unreachable</h1>
      <p>
        The local app server isn't responding. If you run it yourself, start
        it again (npm run dev) - your mail is safe on this machine.
      </p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
